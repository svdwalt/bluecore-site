<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 690" role="img" aria-labelledby="t d">
  <title id="t">BlueCore hardware-free EAP-TLS and MAB test lab</title>
  <desc id="d">A test host running eapol_test and radclient sends RADIUS requests to Cisco ISE as if it were a switch. ISE checks certificate revocation with an OCSP responder on a services host, which also runs the certificate authority, CRL web server, DNS and NTP. A workstation holds the git repo, syncs test cases to the test host and builds and captures the ISE configuration over the API.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4da3ff"/>
    </marker>
    <marker id="arrow-dim" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b7fc4"/>
    </marker>
    <style>
      text { font-family: 'Courier New', Courier, monospace; fill: #8fb4e8; font-size: 13px; }
      .title { fill: #4da3ff; font-size: 15px; font-weight: bold; letter-spacing: 1px; }
      .sub { fill: #5b7fc4; font-size: 12px; }
      .item { fill: #dff0ff; }
      .flow { fill: #dff0ff; font-size: 13px; font-weight: bold; }
      .flow-sub { fill: #5b7fc4; font-size: 12px; }
      .setup { fill: #5b7fc4; font-size: 12px; }
      .box { fill: #061229; stroke: #2b6bff; stroke-width: 1.5; }
      .box-dim { fill: #04101f; stroke: #123a8a; stroke-width: 1.5; }
      .run { stroke: #4da3ff; stroke-width: 2; fill: none; }
      .setup-line { stroke: #5b7fc4; stroke-width: 1.5; stroke-dasharray: 6 5; fill: none; }
      .chev { fill: #4da3ff; }
    </style>
  </defs>

  <rect x="0" y="0" width="960" height="690" fill="#020610"/>

  <!-- Workstation -->
  <rect class="box-dim" x="20" y="24" width="260" height="104"/>
  <text class="title" x="36" y="54">WORKSTATION</text>
  <text x="36" y="82">git repo: cases, runner,</text>
  <text x="36" y="102">results, config snapshot</text>

  <!-- Test host -->
  <rect class="box" x="20" y="200" width="300" height="250"/>
  <text class="title" x="36" y="230">TEST HOST · Linux VM</text>
  <text class="sub" x="36" y="250">stands in for switches + devices</text>
  <text class="item" x="36" y="284">eapol_test</text><text x="140" y="284">802.1X, EAP-TLS</text>
  <text class="item" x="36" y="314">radclient</text><text x="140" y="314">MAB</text>
  <text class="item" x="36" y="344">corpus</text><text x="140" y="344">27 test certificates</text>
  <text class="item" x="36" y="374">runner</text><text x="140" y="374">YAML cases, results</text>
  <text class="item" x="36" y="404">tcpdump</text><text x="140" y="404">RADIUS captures</text>

  <!-- Policy server -->
  <rect class="box" x="620" y="200" width="320" height="250"/>
  <text class="title" x="636" y="230">POLICY SERVER · Cisco ISE 3.5</text>
  <text class="sub" x="636" y="250">the device under test</text>
  <text class="chev" x="636" y="284">&gt;</text><text class="item" x="654" y="284">network device = test host</text>
  <text class="chev" x="636" y="314">&gt;</text><text class="item" x="654" y="314">trusted CA + OCSP check</text>
  <text class="chev" x="636" y="344">&gt;</text><text class="item" x="654" y="344">EAP server certificate</text>
  <text class="chev" x="636" y="374">&gt;</text><text class="item" x="654" y="374">policy sets, authz rules</text>
  <text class="chev" x="636" y="404">&gt;</text><text class="item" x="654" y="404">ERS + OpenAPI</text>

  <!-- Services host -->
  <rect class="box" x="170" y="530" width="620" height="104"/>
  <text class="title" x="186" y="560">SERVICES HOST · Linux VM</text>
  <text class="chev" x="186" y="592">&gt;</text><text class="item" x="204" y="592">root + issuing CA (openssl)</text>
  <text class="chev" x="186" y="618">&gt;</text><text class="item" x="204" y="618">CRL + CA cert web :80</text>
  <text class="chev" x="490" y="592">&gt;</text><text class="item" x="508" y="592">OCSP responder :2560</text>
  <text class="chev" x="490" y="618">&gt;</text><text class="item" x="508" y="618">DNS + NTP time source</text>
  <text class="sub" x="686" y="592">stoppable</text>

  <!-- Test run: 1 request, 4 answer -->
  <line class="run" x1="320" y1="300" x2="618" y2="300" marker-end="url(#arrow)"/>
  <text class="flow" x="469" y="288" text-anchor="middle">① RADIUS Access-Request</text>
  <text class="flow-sub" x="469" y="320" text-anchor="middle">udp/1812 · EAP-TLS or MAB</text>

  <line class="run" x1="620" y1="372" x2="322" y2="372" marker-end="url(#arrow)"/>
  <text class="flow" x="469" y="394" text-anchor="middle">④ Accept + VLAN, or Reject</text>

  <!-- Test run: 2 OCSP query, 3 answer -->
  <line class="run" x1="700" y1="450" x2="700" y2="528" marker-end="url(#arrow)"/>
  <text class="flow" x="690" y="486" text-anchor="end">② OCSP: revoked?</text>
  <text class="flow-sub" x="690" y="504" text-anchor="end">tcp/2560</text>

  <line class="run" x1="760" y1="530" x2="760" y2="452" marker-end="url(#arrow)"/>
  <text class="flow" x="770" y="486">③ good / revoked</text>

  <!-- Setup flows -->
  <line class="setup-line" x1="150" y1="130" x2="150" y2="198" marker-start="url(#arrow-dim)" marker-end="url(#arrow-dim)"/>
  <text class="setup" x="162" y="160">rsync cases in,</text>
  <text class="setup" x="162" y="176">results back</text>

  <path class="setup-line" d="M282,76 H780 V198" marker-end="url(#arrow-dim)"/>
  <text class="setup" x="531" y="64" text-anchor="middle">API: build config, import CA + EAP cert, capture snapshot</text>

  <line class="setup-line" x1="250" y1="530" x2="250" y2="452" marker-end="url(#arrow-dim)"/>
  <text class="setup" x="260" y="486">certificates + keys</text>
  <text class="setup" x="260" y="502">copied to test host</text>

  <!-- Legend -->
  <text class="sub" x="480" y="664" text-anchor="middle">solid ①–④: one test, e.g. a revoked certificate must come back Access-Reject</text>
  <text class="sub" x="480" y="682" text-anchor="middle">dashed: setup and results</text>
</svg>
